[project]
name = "do-mice-pipeline"
version = "0.1.0"
description = "GBRS allele-specific expression pipeline for Diversity Outbred (DO) mice RNA-seq"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "snakemake>=9.23.1",
    "snakemake-executor-plugin-lsf",
    # Used by scripts/combine_tpm.py, which runs as a Snakemake `script:` in the
    # same environment as Snakemake itself.
    "polars>=1.43.0",
    "marimo>=0.23.15",
    "numpy>=2.5.1",
    "lets-plot>=4.11.0",
    "h5py>=3.16.0",
    "scipy>=1.18.0",
    "polars-bio>=0.33.1",
    "pydeseq2>=0.5.4",
    "pandas>=3.0.5",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["util"]

[tool.uv.sources]
snakemake-executor-plugin-lsf = { git = "ssh://git@github.com/tgbrooks/snakemake-executor-plugin-lsf.git", rev = "3f792d70fd01f2a7eb45f23625e398b7dc0321e5" }

[dependency-groups]
dev = [
    "h5py>=3.16.0",
    "ipython>=9.15.0",
    "numpy>=2.0",
    "python-lsp-server>=1.15.0",
    "ruff>=0.16.3",
    "websockets>=17.0.1",
]
